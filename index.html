<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>La Pizzería · Gestión</title>
    <script>
        // Aplica el tema guardado antes del primer pintado (evita el destello del tema por defecto).
        let tema = 'kraft';
        try { tema = localStorage.getItem('pizzeria:tema') || 'kraft'; } catch {}
        document.documentElement.dataset.tema = tema;
    </script>
</head>
<body>
    <div id="root"></div>
    <noscript><p>Esta aplicación necesita JavaScript.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
